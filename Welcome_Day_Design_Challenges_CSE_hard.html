<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overflow:clip}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100%;position:relative;overflow:hidden;overflow:clip;font:13px Tahoma,Verdana,"Segoe UI",sans-serif;background:linear-gradient(var(--s1),var(--s2) 65%)}

.cl{position:absolute;background:#fff;border-radius:60px;filter:blur(9px);opacity:.9}
.h{position:absolute;border-radius:50%}
.h1{left:-30%;width:160%;bottom:-14%;height:48%;background:radial-gradient(ellipse at 40% 15%,var(--g1),var(--g2) 75%)}
.h2{left:-5%;width:80%;bottom:-22%;height:42%;background:radial-gradient(ellipse at 50% 15%,var(--g1),var(--g2))}
#bub{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.b{position:absolute;bottom:-70px;border-radius:50%;border:1px solid #fffa;background:radial-gradient(circle at 30% 28%,#fffd,#fff3 38%,#7fd4ff33 72%);animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) translateX(24px)}}
.scr{position:absolute;inset:0 0 38px 0;display:none;align-items:center;justify-content:center;padding:10px}
.scr.on{display:flex}
.win{width:min(440px,100%);background:var(--win);color:#10264d;border:1px solid #0040c8;border-radius:9px 9px 3px 3px;box-shadow:0 14px 34px #0007,inset 0 0 0 2px #fff7;overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.win.big{width:min(720px,100%)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sh{animation:sh .4s}@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.tt{display:flex;direction:ltr;align-items:center;gap:6px;padding:5px 6px 5px 9px;color:#fff;font-weight:700;text-shadow:1px 1px #0009;background:linear-gradient(#4a9dff,#0a5bea 14%,#0046d5 86%,#0a36a8)}
.tt span{flex:1}
.bd{padding:16px;text-align:center}
.btn{font:700 1em Tahoma,sans-serif;padding:9px 20px;margin:4px;border-radius:22px;border:1px solid #2a7a1a;color:#fff;cursor:pointer;background:linear-gradient(#c3f87c,#55c72a 50%,#2e9d12 52%,#7ddc45);box-shadow:inset 0 1px #fffb,0 3px 6px #0005;text-shadow:0 1px 2px #0008}
.btn.w{background:linear-gradient(#fff,#e8eef8 50%,#cbd7ea 52%,#eef3fb);color:#123;border-color:#7d93b8;text-shadow:none}
.btn:active{transform:translateY(1px)}
.wd{font:400 clamp(40px,11vw,74px)/.95 Impact,"Arial Black",sans-serif;margin:8px 0 4px;background:linear-gradient(#e9ffff,#3cb4f5 48%,#0a6cc0 52%,#57c5ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #0a4a8a;filter:drop-shadow(0 3px 0 #0a4a8a) drop-shadow(0 0 12px #9ff)}
.wd b{font-weight:400;background:linear-gradient(#fff9b0,#c6ec2b 50%,#4c9a10 52%,#a5e03a);-webkit-background-clip:text;background-clip:text}
#boot{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;background:radial-gradient(circle at 50% 42%,#1d6bd8,#062a78 45%,#020b2b);transition:opacity .6s}
#boot.off{opacity:0;pointer-events:none}
#boot svg{width:min(34vw,140px);filter:drop-shadow(0 0 22px #5cf)}
.pb{width:min(70vw,260px);height:16px;padding:2px;border:1px solid #9ab;border-radius:5px;background:#0006}
#fill{height:100%;width:0;transition:width 2.5s linear;background:repeating-linear-gradient(90deg,#3fd12a 0 9px,transparent 9px 12px);border-radius:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:3px solid #fff;border-radius:14px;padding:0;cursor:pointer;background:#fff;box-shadow:0 4px 10px #0005;font:700 1em Tahoma,sans-serif;overflow:hidden;transition:.2s}
.opt .sc{height:calc(118px*var(--u));display:flex;align-items:center;justify-content:center;padding:6px;line-height:1;background:linear-gradient(#e3ecf8 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,#e3ecf8 1px,transparent 1px) 0 0/12px 12px,#fff}.opt .sc svg{width:100%;height:100%;display:block}
.opt em{display:block;padding:6px;font-size:1.15em;font-style:normal;background:linear-gradient(#fff,#dde8f7)}
.opt.ok{border-color:#3fd12a;box-shadow:0 0 0 3px #b6ff8f,0 0 22px #5f5;transform:scale(1.05)}
.opt.bad{border-color:#e0401c}.opt.dim{opacity:.5}
.tb{height:12px;border:1px solid #7f9db9;background:#fff;border-radius:4px;padding:1px}
#bar{height:100%;width:100%;border-radius:3px;background:linear-gradient(#c3f87c,#3fbf1e)}
.top{display:flex;justify-content:space-between;margin:8px 2px}
#msg{min-height:1.6em;margin:12px 0 4px;font-weight:700;color:#0b3d91}
table{width:100%;border-collapse:collapse;background:#fff}td{border:1px solid #aab;padding:6px}
#tb{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;z-index:5;color:#fff;background:linear-gradient(#3b78e7,#2a5fd8 12%,#2359d6 85%,#1a3fa3)}
#st{height:100%;padding:0 22px 0 12px;border:0;border-radius:0;border-start-end-radius:16px;border-end-end-radius:16px;color:#fff;font:italic 900 1.25em Tahoma,sans-serif;text-shadow:1px 1px 2px #000a;cursor:pointer;background:linear-gradient(#66c45a,#3c9a2e 50%,#2b7d20)}
#tb p{flex:1;margin:0 10px;font-weight:700;text-shadow:1px 1px #0008;white-space:nowrap;overflow:hidden}
#clk{padding:0 12px;height:100%;display:flex;align-items:center;background:linear-gradient(#1290e8,#0f7bd6)}
#sm{position:absolute;inset-inline-start:0;bottom:38px;width:min(230px,80vw);z-index:6;border-radius:8px 8px 0 0;overflow:hidden;background:#fff;box-shadow:0 8px 24px #0008}
#sm div{padding:12px;color:#fff;font-weight:700;background:linear-gradient(#2a66d9,#0c46b8)}
#sm button{display:block;width:100%;padding:12px;text-align:start;color:#10264d;border:0;background:#fff;font:inherit;cursor:pointer}#sm button:hover{background:#2f71e0;color:#fff}
@media(prefers-reduced-motion:reduce){.b,.win{animation:none}}

.tt button{width:22px;height:22px;padding:0;border:1px solid #fff;border-radius:4px;color:#fff;font:700 13px/1 Tahoma,sans-serif;cursor:pointer;text-shadow:1px 1px #0009;background:linear-gradient(#5aa5ff,#1c5fe0)}
.tt .x{background:linear-gradient(#f59a7c,#d9431c)}
.tt button:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid #ffd93b;outline-offset:2px}
.opt{color:#10264d}
.ov{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:10px;background:#0a2a6a55}.ov.on{display:flex}
.lg{height:118px;border:3px solid #fff;border-radius:16px;box-shadow:0 4px 14px #0006,0 0 22px #6cf;margin-bottom:6px}#boot .lg{height:min(30vh,190px)}
ol{text-align:start;line-height:1.6;margin:8px 0 12px;padding-inline-start:22px}
#later{touch-action:manipulation}#later.fly{position:fixed;z-index:7;margin:0;transition:left .22s cubic-bezier(.3,1.5,.5,1),top .22s cubic-bezier(.3,1.5,.5,1)}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:10;width:max-content;max-width:88vw;padding:12px 16px;border:1px solid #000;border-radius:10px;background:#ffffe1;color:#111;font-weight:700;text-align:center;box-shadow:0 6px 18px #0006}
#lb{height:100%;border:0;padding:0 10px;color:#fff;font:700 1em Tahoma,sans-serif;cursor:pointer;background:linear-gradient(#1a9aef,#1170d0)}
#lm{position:absolute;inset-inline-end:0;bottom:38px;z-index:6;width:min(180px,70vw);border-radius:8px 8px 0 0;overflow:hidden;background:#fff;box-shadow:0 8px 24px #0008}
#lm button{display:block;width:100%;padding:12px;text-align:start;border:0;background:#fff;color:#10264d;font:inherit;cursor:pointer}#lm button:hover,#lm button.a{background:#2f71e0;color:#fff}
@media(max-width:599px){.opts{grid-template-columns:1fr;gap:8px}.opt{display:flex;align-items:stretch}.opt .sc{flex:1;height:92px;padding-bottom:6px}.opt em{width:78px;display:flex;align-items:center;justify-content:center;padding:0 4px}}
.asm{display:flex;flex-wrap:wrap;gap:10px;text-align:start}
.stg{flex:1 1 300px;min-width:0;border:3px solid #fff;border-radius:12px;background:#dfe6f2;box-shadow:0 4px 10px #0005;overflow:hidden;transition:.2s}
.stg.ok{border-color:#3fd12a;box-shadow:0 0 0 3px #b6ff8f,0 0 22px #5f5}
.stg svg{display:block;width:100%;height:min(44vh,320px);touch-action:none;user-select:none;-webkit-user-select:none;outline:0}
.stg svg:focus-visible{outline:3px solid #ffd93b;outline-offset:-3px}
.cp{cursor:grab}.cp:active{cursor:grabbing}
.ht{fill:transparent}
.sel{display:none;fill:none;stroke:#ff7a1a;stroke-width:1.6px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}
.cp.on .sel{display:block}
.rv .cp{transition:transform .7s cubic-bezier(.3,1.2,.4,1)}
.pnl{flex:0 0 170px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ref{border:3px solid #fff;border-radius:12px;background:linear-gradient(#fff,#dde8f7);box-shadow:0 4px 10px #0005;padding:4px 6px 6px;text-align:center}
.ref svg{display:block;width:100%;height:auto;max-height:104px;border-radius:6px}
.ctl{border:3px solid #fff;border-radius:12px;background:linear-gradient(#fff,#dde8f7);box-shadow:0 4px 10px #0005;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:center}
.ctl input{width:100%;accent-color:#2c87ee}
.btn.sm{padding:5px 12px;margin:2px;font-size:.95em}
#cn{min-height:1.3em;color:#0b3d91}
@media(max-width:599px){.stg svg{height:min(34vh,300px)}.pnl{flex:1 1 100%;flex-direction:row}.pnl>*{flex:1 1 0}.ref svg{max-height:96px}}

const p=d.c.map(c=>{let q;for(let n=0;n<80;n++){q={x:d.W*(.1+.8*Math.random()),y:d.H*(.15+.7*Math.random())};if(Math.hypot(q.x-c.t.x,q.y-c.t.y)>tol*3.5)break}q.s=c.t.s*(Math.random()<.5?.5+Math.random()*.15:1.4+Math.random()*.3);q.r=(Math.random()<.5?-1:1)*(25+Math.random()*95);return q});
AS={d,p,tol,sel:-1};
$("#opts").innerHTML=`<div class="stg" id="stg"><svg id="stage" viewBox="0 0 ${d.W} ${d.H}" tabindex="0" role="application" aria-label="${T.aria}">${lg(d,p,1)}</svg></div><div class="pnl"><div class="ref"><small data-k="mdl"></small><div id="rf" style="filter:blur(7px);transition:filter .2s"><svg viewBox="0 0 ${d.W} ${d.H}" aria-hidden="true">${lg(d,tg,0)}</svg></div><button class="btn w sm" id="pk">👁 (3)</button></div><div class="ctl"><b id="cn"></b><input type="range" id="rs" min="25" max="280" step="1" aria-label="Size"><input type="range" id="ro" min="-180" max="180" step="1" value="0" aria-label="Rotation" title="Rotation"><div><button class="btn w sm" id="cy" data-k="cyc"></button><button class="btn sm" id="chk" data-k="vf"></button></div></div></div>`;
bind();sync()}
function bind(){const st=$("#stage"),W=AS.d.W,H=AS.d.H,cl=(v,m)=>Math.max(0,Math.min(m,v)),pt=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(st.getScreenCTM().inverse());
st.onpointerdown=e=>{const g=e.target.closest(".cp");if(!g||done)return;e.preventDefault();selc(+g.dataset.j);const q=pt(e),c=AS.p[AS.sel];drag={dx:c.x-q.x,dy:c.y-q.y};try{st.setPointerCapture(e.pointerId)}catch(_){}st.focus({preventScroll:true})};
st.onpointermove=e=>{if(!drag||done)return;const q=pt(e),c=AS.p[AS.sel];c.x=cl(q.x+drag.dx,W);c.y=cl(q.y+drag.dy,H);upd()};
st.onpointerup=st.onpointercancel=()=>{drag=null};
st.onkeydown=e=>{if(done)return;const k=e.key;if(k=="Enter"){e.preventDefault();return chk()}
if(AS.sel<0){if(k.startsWith("Arrow")||k==" "){selc(0);e.preventDefault()}return}
const c=AS.p[AS.sel],d=e.shiftKey?2:.5,mv={ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[k];
if(mv){c.x=cl(c.x+mv[0],W);c.y=cl(c.y+mv[1],H);upd();e.preventDefault()}
else if(k=="+"||k=="="){c.s=Math.min(2.8,c.s+.03);upd();e.preventDefault()}
else if(k=="-"||k=="_"){c.s=Math.max(.25,c.s-.03);upd();e.preventDefault()}
else if(k=="r"||k=="R"){c.r=(c.r+(e.shiftKey?-3:3))%360;upd();e.preventDefault()}
else if(k==" "){selc((AS.sel+1)%AS.d.c.length);e.preventDefault()}};
$("#rs").oninput=e=>{if(AS.sel<0||done)return;AS.p[AS.sel].s=e.target.value/100;upd()};
AS.pk=3;$("#pk").onclick=()=>{if(done||AS.pk<=0||$("#rf").style.filter=="none")return;AS.pk--;$("#pk").textContent="👁 ("+AS.pk+")";$("#rf").style.filter="none";setTimeout(()=>{if(!done)$("#rf").style.filter="blur(7px)"},2000)};
$("#ro").oninput=e=>{if(AS.sel<0||done)return;AS.p[AS.sel].r=+e.target.value;upd()};
$("#cy").onclick=()=>{if(!done)selc((AS.sel+1)%AS.d.c.length)};
$("#chk").onclick=chk}
function selc(j){AS.sel=j;const st=$("#stage");$$("#stage .cp").forEach(g=>g.classList.toggle("on",+g.dataset.j==j));const g=st.querySelector(`.cp[data-j="${j}"]`);if(g&&g!==st.lastElementChild)st.appendChild(g);sync()}
function upd(){if(AS.sel<0)return;const c=AS.p[AS.sel],g=$(`#stage .cp[data-j="${AS.sel}"]`);g.style.transform=`translate(${c.x}px,${c.y}px) rotate(${c.r}deg) scale(${c.s})`;const r=$("#rs");if(r)r.value=Math.round(c.s*100);const ro=$("#ro");if(ro)ro.value=Math.round(c.r)}
function sync(){const r=$("#rs"),n=$("#cn");if(!r||!AS)return;const c=AS.sel>=0?AS.d.c[AS.sel]:null;n.textContent=c?c.n[document.documentElement.lang]:T.nosel;r.disabled=!c||!!done;const ro=$("#ro");if(ro)ro.disabled=!c||!!done;if(c){r.value=Math.round(AS.p[AS.sel].s*100);ro.value=Math.round(AS.p[AS.sel].r)}}
function frz(){const b=$("#bar");b.style.width=getComputedStyle(b).width;b.style.transition="none"}
function chk(){if(done||!AS)return;const n=AS.d.c.length;let ok=0;AS.d.c.forEach((c,j)=>{const p=AS.p[j];if(Math.hypot(p.x-c.t.x,p.y-c.t.y)<=AS.tol&&Math.abs(p.s/c.t.s-1)<=.28&&Math.abs(((p.r%360)+540)%360-180)<=20)ok++});
if(ok<n){mf=()=>T.part(ok,n);tr();return}
done=1;clearInterval(tm);frz();sc++;$("#sc").textContent=sc;const st=$("#stage");[...st.querySelectorAll(".cp")].sort((a,b)=>a.dataset.j-b.dataset.j).forEach(g=>st.appendChild(g));$$("#stage .cp").forEach(g=>g.classList.remove("on"));$("#stg").classList.add("ok");$("#rs").disabled=true;$("#ro").disabled=true;$("#rf").style.filter="none";
const g=G[i];mf=()=>T.asok+"<br><small style=\"font-weight:400\">"+T.as[g.x].w+"</small>";$("#nx").hidden=0;tr()}
function asmEnd(){if(done)return;done=1;clearInterval(tm);frz();const st=$("#stage");st.classList.add("rv");$$("#stage .cp").forEach(g=>g.classList.remove("on"));AS.d.c.forEach((c,j)=>{st.querySelector(`.cp[data-j="${j}"]`).style.transform=`translate(${c.t.x}px,${c.t.y}px) rotate(0deg) scale(${c.t.s})`});$("#rs").disabled=true;$("#ro").disabled=true;$("#rf").style.filter="none";mf=()=>T.to+T.asend;$("#nx").hidden=0;tr()}

let G=[];
let T=L.fr,i=0,sc=0,done=1,tm,bt,left,cur="",mf=()=>"",dodged=0;
function lay(){}
function show(id){cur=id;$$(".scr").forEach(s=>s.classList.toggle("on",s.id==id))}
function ov(id,on){$("#"+id).classList.toggle("on",!!on)}
function keyT(){$("#kt").innerHTML="<tr>"+T.th.map(h=>`<td><b>${h}</b></td>`).join("")+"</tr>"+G.map((g,x)=>`<tr><td>${x+1}</td><td>${g.t=="q"?T.ch[g.x].n:T.as[g.x].n}</td><td><b>${g.t=="q"?T.sz[g.k]:T.ak}</b></td></tr>`).join("")}
function tr(){$$("[data-k]").forEach(e=>e.innerHTML=T[e.dataset.k]);$("#how ol").innerHTML=T.how.map(s=>`<li>${s}</li>`).join("");
if(cur=="game"){$("#q").innerHTML=T.q(i+1,G[i].t=="q"?T.ch[G[i].x].q:T.as[G[i].x].q);$$(".opt em").forEach((e,x)=>e.textContent=T.sz[x]);$("#msg").innerHTML=mf();$("#nx").textContent=i<N-1?T.nx:T.res;if(AS){$("#stage")?.setAttribute("aria-label",T.aria);sync()}}
if(cur=="end")$("#fm").textContent=T.f[sc>6?0:sc>4?1:2];keyT()}
function setLang(c){T=L[c];const d=document.documentElement;d.lang=c;d.dir=c=="ar"?"rtl":"ltr";$("#lb").textContent="🌐 "+c.toUpperCase();$$("#lm button").forEach(b=>b.classList.toggle("a",b.dataset.c==c));tr()}
for(let n=0;n<16;n++){const b=document.createElement("span"),s=14+Math.random()*44;b.className="b";b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${9+Math.random()*9}s;animation-delay:-${Math.random()*14}s`;$("#bub").appendChild(b)}
const clk=()=>$("#clk").textContent=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});clk();setInterval(clk,20000);
function resetLater(){lt.classList.remove("fly");lt.style.left=lt.style.top="";lt.disabled=false;$("#ph")?.remove()}
function boot(){clearInterval(tm);clearTimeout(bt);ov("how",0);ov("key",0);resetLater();show("");$("#inv1").hidden=0;$("#inv2").hidden=1;const b=$("#boot"),f=$("#fill");b.classList.remove("off");f.style.transition="none";f.style.width="0";void f.offsetWidth;f.style.transition="";f.style.width="100%";bt=setTimeout(()=>{b.classList.add("off");show("inv")},2900)}
function home(){clearInterval(tm);ov("how",0);ov("key",0);show("intro")}
function accept(){$("#inv1").hidden=1;$("#inv2").hidden=0;setTimeout(()=>show("intro"),1300)}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=0;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=1,2400)}
function flee(px=innerWidth/2,py=innerHeight/2){
if(!lt.classList.contains("fly")){const r=lt.getBoundingClientRect(),p=document.createElement("span");p.id="ph";p.style.cssText=`display:inline-block;width:${r.width}px;height:${r.height}px;margin:4px`;lt.before(p);lt.classList.add("fly");lt.style.left=r.left+"px";lt.style.top=r.top+"px";void lt.offsetWidth}
const w=lt.offsetWidth,h=lt.offsetHeight,mx=Math.max(8,innerWidth-w-8),my=Math.max(56,innerHeight-h-56);let b=[8,56],d=-1;
for(let k=0;k<14;k++){const x=8+Math.random()*(mx-8),y=56+Math.random()*(my-56),c=Math.hypot(x+w/2-px,y+h/2-py);if(c>d){d=c;b=[x,y]}}
lt.style.left=b[0]+"px";lt.style.top=b[1]+"px"}
document.addEventListener("pointermove",e=>{if(e.pointerType!="mouse"||cur!="inv"||$("#inv1").hidden)return;const r=lt.getBoundingClientRect();if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<Math.max(r.width,r.height)*1.1+30)flee(e.clientX,e.clientY)});
lt.addEventListener("pointerdown",e=>{dodged=0;if(e.pointerType!="mouse"&&Math.random()<.8){e.preventDefault();dodged=1;flee(e.clientX,e.clientY)}});
lt.onclick=()=>{if(dodged){dodged=0;return}lt.disabled=true;toast(T.caught);setTimeout(accept,2400)};
addEventListener("resize",()=>{lay();if(cur=="inv"&&lt.classList.contains("fly"))flee()});
$("#acc").onclick=accept;
document.addEventListener("click",e=>{
if(!e.target.closest("#sm,#st"))$("#sm").hidden=1;if(!e.target.closest("#lm,#lb"))$("#lm").hidden=1;
const b=e.target.closest(".tt button");if(!b)return;
if(b.classList.contains("c"))return b.closest(".ov").classList.remove("on");
if(b.classList.contains("q"))return ov("how",1);
if(cur=="inv")flee(e.clientX,e.clientY);else if(cur=="intro")boot();else home()});
$("#hok").onclick=()=>ov("how",0);$("#kc").onclick=()=>ov("key",0);
$("#play").onclick=start;$("#again").onclick=start;
function start(){newG();i=0;sc=0;ov("how",0);show("game");round()}
function round(){done=0;const g=G[i];TT=g.t=="q"?30:80;left=TT;AS=null;drag=null;const o=$("#opts");
if(g.t=="q"){o.className="opts";o.innerHTML=[0,1,2].map(j=>`<button class="opt" data-j="${j}"><div class="sc">${Q[g.x].v(g.ord[j],j)}</div><em></em></button>`).join("");mf=()=>T.tap}
else{o.className="asm";asmInit(g.x);mf=()=>T.asmtip}
$("#nx").hidden=1;$("#sc").textContent=sc;$("#tl").textContent=TT+"s";
const b=$("#bar");b.style.transition="none";b.style.width="100%";void b.offsetWidth;b.style.transition=`width ${TT}s linear`;b.style.width="0";
clearInterval(tm);tm=setInterval(()=>{$("#tl").textContent=--left+"s";if(left<=0)g.t=="q"?pick(-1):asmEnd()},1000);tr()}
function pick(j){if(done)return;done=1;clearInterval(tm);const g=G[i],k=g.k,b=$("#bar");b.style.width=getComputedStyle(b).width;b.style.transition="none";
$$(".opt").forEach((o,x)=>o.classList.add(x==k?"ok":x==j?"bad":"dim"));if(j==k)sc++;$("#sc").textContent=sc;
mf=()=>(j==k?T.ok:(j<0?T.to:T.ko)+T.ans+"<b>"+T.sz[k]+"</b>")+"<br><small style=\"font-weight:400\">"+T.ch[g.x].w+"</small>";$("#nx").hidden=0;tr()}
$("#opts").onclick=e=>{const o=e.target.closest(".opt");if(o)pick(+o.dataset.j)};
$("#nx").onclick=()=>{if(i<N-1){i++;round()}else{show("end");$("#fin").textContent=sc+" / "+N;tr()}};
$("#st").onclick=()=>$("#sm").hidden=!$("#sm").hidden;

$("#mr").onclick=()=>{$("#sm").hidden=1;boot()};
$$(".lg").forEach(g=>g.src=LOGO);prep();newG();setLang("fr");boot();
</script></body></html>
